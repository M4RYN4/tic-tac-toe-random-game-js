<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Game</title>
    <!-- Favicon links -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
  </head>   
  <body>
    <div class="wrap">
      <header>
        <div class="header-game">
          <div>
            <h1 class="heading1">Tic Tac Toe Game</h1>
          </div>
        </div>
      </header>
      <main>
        <h2 id="text-content"></h2>
          <div id="main-game-wrapper">
            <div id="main-game">
              <div data-index="0" class="cell"></div>
              <div data-index="1" class="cell"></div>
              <div data-index="2" class="cell"></div>
              <div data-index="3" class="cell"></div>
              <div data-index="4" class="cell"></div>
              <div data-index="5" class="cell"></div>
              <div data-index="6" class="cell"></div>
              <div data-index="7" class="cell"></div>
              <div data-index="8" class="cell"></div>
            </div>
            <div class="games-score-wrapper">
              <div>
                <h2 class="games-score-label">Game results:</h2>
                <div id="games-score"></div>
              </div>
            </div>
            <button id="btn-new-game" class="btn-game">New Game</button>
            <button id="btn-next-round" class="btn-game">Next Round</button>
          </div>
      </main>
      <footer>
        <div class="footer-school-github">          
          <div class="footer-username">
            <a href="https://github.com/M4RYN4" title="GitHub" class="footer-link">
              <img id="logo-Git-Hub" src="./images/GitHub-Mark-120px-plus.png" alt="GitHub">
                <span id="github-username">M4RYN4</span>
            </a>   
          </div>
        </div>
      </footer>
  </div>
  <script src="scripts/index.js"></script>
  </body>
</html>
